# Local stack: the app built from this checkout plus its own Postgres 16
# (same major as production), seeded from a production backup with
# local-restore.sh. Independent of any Postgres installed on the host.
#
#   deploy/local-restore.sh            # first time, or to reset to latest.dump
#   docker compose -f deploy/docker-compose.local.yml up -d --build app
#
# DEV ONLY: every request is auto-logged-in as SONGBOOKS_DEV_AUTO_LOGIN
# (default tapoueh), so both ports are bound to 127.0.0.1 only.
name: songbooks-local

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: songbooks
      POSTGRES_PASSWORD: songbooks-local
      POSTGRES_DB: songbooks
    volumes:
      - songbooks_local_db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${SONGBOOKS_LOCAL_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U songbooks -d songbooks"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.local
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The zone dates and times are shown in (events, rehearsals, the
      # home calendar); the people using this play around Paris.
      TZ: ${SONGBOOKS_TZ:-Europe/Paris}
      DATABASE_URL: postgres://songbooks:songbooks-local@db:5432/songbooks?sslmode=disable
      SONGBOOKS_DEV_AUTO_LOGIN: ${SONGBOOKS_DEV_AUTO_LOGIN:-tapoueh}
    command: ["--addr", "0.0.0.0:8080"]
    ports:
      - "127.0.0.1:${SONGBOOKS_LOCAL_PORT:-8102}:8080"

volumes:
  songbooks_local_db:

# An explicit subnet: a dev machine with many other compose projects can
# run out of Docker's default address pools ("all predefined address pools
# have been fully subnetted").
networks:
  default:
    ipam:
      config:
        - subnet: 10.231.17.0/24
