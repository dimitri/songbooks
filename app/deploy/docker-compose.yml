name: songbooks

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-songbooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-songbooks}
    volumes:
      - songbooks_db_data:/var/lib/postgresql/data
    # No host port published — only the app container talks to Postgres,
    # over the compose-internal network, same shape as gites' db service.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-songbooks} -d ${POSTGRES_DB:-songbooks}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-songbooks}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-songbooks}?sslmode=disable
      # SONGBOOKS_V2_ROOT intentionally unset: PDF export is pure Go and
      # in-process now (internal/pdfnative) — no /v2 checkout, no `typst`
      # binary, no bind mount needed. Setting this would switch PDF export
      # back to the old Typst-shelling pdf.Bridge (kept as a rollback
      # path), which this image no longer ships typst for — don't set it
      # here without also restoring the Typst install step in Dockerfile.
      #
      # SONGBOOKS_DEV_AUTO_LOGIN: opt-in, default EMPTY (off) — this var is
      # only ever read from deploy/.env, never set here. Leaving the
      # reference empty-by-default means blindly copying this compose file
      # to a brand-new deployment is still safe (auth stays on unless that
      # new deployment's own .env deliberately sets it). Setting it
      # disables login for every visitor who can reach the server — see
      # main.go's own flag description. Currently set on dev-runner/staging
      # ONLY, at the user's explicit instruction (not production,
      # song data recoverable from the git repo) — never on a real
      # production deployment.
      SONGBOOKS_DEV_AUTO_LOGIN: ${SONGBOOKS_DEV_AUTO_LOGIN:-}
    command: ["--addr", "0.0.0.0:8080"]
    ports:
      # 8102: chosen after checking `ss -tlnp` + `docker ps` on the host —
      # 8090-8094/8099-8101 and the 18000s are already taken by the gites
      # and pr0 stacks, prlobby and docs-reader; 8102 was free.
      - "127.0.0.1:8102:8080"

volumes:
  songbooks_db_data:
