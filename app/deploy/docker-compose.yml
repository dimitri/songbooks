# Two deployments run from this file on the host (deploy/target.sh):
# production (app.songbooks.studio) and staging (songbooks.tapoueh.org),
# each its own clone with its own .env, which names its compose project
# (COMPOSE_PROJECT_NAME: songbooks-prod, songbooks), its port
# (SONGBOOKS_PORT) and whether the stems worker runs (COMPOSE_PROFILES=stems).
name: songbooks

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-songbooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-songbooks}
    volumes:
      - songbooks_db_data:/var/lib/postgresql/data
    # No host port published — only the app container talks to Postgres,
    # over the compose-internal network, same shape as gites' db service.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-songbooks} -d ${POSTGRES_DB:-songbooks}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The zone dates and times are shown in (events, rehearsals, the
      # home calendar); the people using this play around Paris.
      TZ: ${SONGBOOKS_TZ:-Europe/Paris}
      DATABASE_URL: postgres://${POSTGRES_USER:-songbooks}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-songbooks}?sslmode=disable
      # SONGBOOKS_DEV_AUTO_LOGIN: opt-in, default EMPTY (off) — this var is
      # only ever read from deploy/.env, never set here. Leaving the
      # reference empty-by-default means blindly copying this compose file
      # to a brand-new deployment is still safe (auth stays on unless that
      # new deployment's own .env deliberately sets it). Setting it
      # disables login for every visitor who can reach the server — see
      # main.go's own flag description. Currently set on dev-runner/staging
      # ONLY, at the user's explicit instruction (not production,
      # song data recoverable from the git repo) — never on a real
      # production deployment.
      SONGBOOKS_DEV_AUTO_LOGIN: ${SONGBOOKS_DEV_AUTO_LOGIN:-}
      # Pins passkey (WebAuthn) registrations/logins to this deployment's
      # real hostname instead of deriving the Relying Party ID from each
      # request's own Host header (a dev-only convenience — see
      # internal/httpapi/webauthn.go's webauthnForRequest and this repo's
      # deploy/README.md). Must be set to exactly the public hostname,
      # songbooks.tapoueh.org, in deploy/.env before any passkey is
      # registered here — a passkey made under one RPID never works under
      # another.
      SONGBOOKS_WEBAUTHN_RP_ID: ${SONGBOOKS_WEBAUTHN_RP_ID:-}
      # Admin-gated file staging (GET /admin/files/{name} — see
      # internal/httpapi/admin_files.go) — opt-in, default EMPTY (off),
      # same posture as SONGBOOKS_DEV_AUTO_LOGIN above. Only ever set in
      # deploy/.env for the duration of a deliberate one-off bulk-import
      # operation; ./import-staging (gitignored, see the volumes: entry
      # below) is where files to import are dropped on the host first.
      SONGBOOKS_ADMIN_FILE_DIR: ${SONGBOOKS_ADMIN_FILE_DIR:-}
      # Live lessons (docs/live-lessons.md): the key Galène checks the
      # lessons' join tokens with, written by galene/setup.sh; and
      # Galène's address (production's, by default). No key, no join.
      SONGBOOKS_GALENE_KEY: ${SONGBOOKS_GALENE_KEY:-}
      SONGBOOKS_GALENE_URL: ${SONGBOOKS_GALENE_URL:-}
      # A demo copy (staging's .env may say 1; production never): the admin
      # page's Demo data panel, and sbdemo allowed on host db
      # (docs/demo-data.md).
      SONGBOOKS_DEMO_DATA: ${SONGBOOKS_DEMO_DATA:-}
    command: ["--addr", "0.0.0.0:8080"]
    ports:
      # 8102: chosen after checking `ss -tlnp` + `docker ps` on the host —
      # 8090-8094/8099-8101 and the 18000s are already taken by the gites
      # and pr0 stacks, prlobby and docs-reader; 8102 was free.
      - "127.0.0.1:${SONGBOOKS_PORT:-8102}:8080"
    volumes:
      - ./import-staging:/import-staging:ro

  # Splits reference recordings into their parts (Demucs) in the
  # background: cmd/stemsd, deploy/Dockerfile.stems,
  # docs/stems-and-key.md. An upload at a time, at once, and the backlog
  # beside it niced, capped at 16 of the host's 24 hardware threads so the
  # app and the other stacks keep theirs.
  stems:
    # Production's only (COMPOSE_PROFILES=stems in its .env): one worker
    # for the host is enough, and staging's recordings can wait.
    profiles: ["stems"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.stems
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-songbooks}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-songbooks}?sslmode=disable
      # Left alone, PyTorch starts a thread per core of the host (24), all
      # fighting over the cores the container gets; stemsd sets its own
      # (--threads) for Demucs and the analysis.
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    # Two lanes (cmd/stemsd, docs/stems-and-key.md): an upload is split at
    # once, 4 of its segments side by side on 4 threads each (on this
    # host's 12 cores, PyTorch's threads alone stop paying past 12, side
    # by side segments keep paying to 16: Demucs splits a 3:30 song in
    # 3:15, 5:55 on 8 threads); the backlog (splits done again, analyses
    # queued apart) runs beside it, niced, on 2 threads.
    command: ["--threads", "4", "--jobs", "4", "--backlog-threads", "2"]
    # Never more than 16 of the 24 hardware threads, and below the app,
    # the database and the videoconference when the host is busy (its
    # whole cap when it isn't: the weight only counts under contention).
    cpus: 16
    cpu_shares: 512
    # An upload's split peaks near 4 GB, the backlog's beside it near 1.5.
    mem_limit: 10g

  # Live lessons' videoconference server (docs/live-lessons.md): production
  # only (COMPOSE_PROFILES=stems,live), its configuration from
  # galene/setup.sh. Host networking: it must offer the host's own address
  # for audio and video (UDP 40000, its TURN server on 1194), which Docker's
  # NAT would hide. Its web side listens on 127.0.0.1:8444, behind Caddy
  # (live.songbooks.studio).
  galene:
    profiles: ["live"]
    build:
      context: ./galene
    restart: unless-stopped
    network_mode: host
    command: ["-insecure", "-http", "127.0.0.1:8444", "-udp-range", "40000", "-turn", "auto"]
    volumes:
      - ./galene/data:/galene/data:ro
      - ./galene/groups:/galene/groups:ro
    ulimits:
      nofile: {soft: 65536, hard: 65536}

volumes:
  songbooks_db_data:
