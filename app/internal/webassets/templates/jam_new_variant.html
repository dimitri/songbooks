{{define "jam_new_variant"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Name}} — new song</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<header class="app-header">
  <h1>{{.Name}}</h1>
  <p>Playing as <strong>{{.Nickname}}</strong> &middot; <a href="/jam/{{.Code}}/songs">back to songs</a></p>
</header>
<main class="index">
  <form class="card" method="POST" action="/jam/{{.Code}}/new">
    <p><label>Title <input type="text" name="title" required></label></p>
    <p><label>Artist <input type="text" name="artist"></label></p>
    <p>This creates a brand-new song, visible only within this jam — you can fill in the chords/lyrics once it's on the song list.</p>
    <button type="submit">create for tonight</button>
  </form>
</main>
</body>
</html>
{{end}}
