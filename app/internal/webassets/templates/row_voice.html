{{/* A songbook row's melody range, and how it sits in the student's
     voice at the row's key (httpapi/row_voice.go): "A2–E4 · fits".
     Needs a rowVoice; nothing when the melody isn't known. */}}
{{define "row-voice"}}{{if .Range}}<span class="row-voice{{if .Out}} is-out{{else if .Fit}} is-fit{{end}}" title="{{.Title}}"><span class="row-voice-range">{{.Range}}</span>{{with .Fit}}<span class="row-voice-fit">{{.}}</span>{{end}}</span>{{end}}{{end}}
