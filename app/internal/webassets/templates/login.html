{{define "login"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Songbooks</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<main class="index">
  <div class="hero">
    <div>
      <h2>Log in</h2>
      <p>Enter your email and we'll send you a link to log in — no password needed.</p>
    </div>
  </div>
  <form class="card" method="post" action="/login" style="max-width:360px">
    {{if .Error}}<p style="color:#b33">Something went wrong — please try again.</p>{{end}}
    <p><label>Email<br><input type="email" name="email" autocomplete="email" required autofocus></label></p>
    <button type="submit">Send me a login link</button>
  </form>
  <p class="hint">New here? You'll need an invite link to create an account.</p>
</main>
</body>
</html>
{{end}}
