{{define "bands"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My bands — Songbooks</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<header class="app-header">
  <a class="back-link" href="/">{{template "icon-back"}} Home</a>
  <h1>My bands</h1>
</header>
<main class="index">
  <table class="card" style="width:100%">
    <thead><tr><th>Name</th><th></th></tr></thead>
    <tbody>
    {{range .Bands}}
      <tr>
        <td><a href="/bands/{{.ID}}">{{.Name}}</a></td>
        <td><a href="/bands/{{.ID}}/catalog">repertoire</a></td>
      </tr>
    {{else}}
      <tr><td colspan="2" class="hint">You're not in any bands yet.</td></tr>
    {{end}}
    </tbody>
  </table>

  <div class="card" style="max-width:420px">
    <h2>Start a band</h2>
    <p>
      <label>Name <input type="text" id="new-band-name" placeholder="e.g. The Fretless"></label>
    </p>
    <button type="button" id="create-band-btn">Create band</button>
    <p id="create-band-result" class="hint"></p>
  </div>
</main>
<script>
document.getElementById('create-band-btn').addEventListener('click', async () => {
  const name = document.getElementById('new-band-name').value.trim();
  if (!name) return;
  const res = await fetch('/api/bands', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name}),
  });
  const data = await res.json();
  if (res.ok) {
    location.href = `/bands/${data.id}`;
  } else {
    document.getElementById('create-band-result').textContent = data.error || 'failed to create band';
  }
});
</script>
</body>
</html>
{{end}}
